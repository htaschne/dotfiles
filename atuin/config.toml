# Keep all command history locally. No account or sync is configured.
auto_sync = false
update_check = false
search_mode = "daemon-fuzzy"
filter_mode = "global"
style = "compact"
inline_height = 18
show_preview = true
enter_accept = false
keymap_mode = "emacs"
history_filter = ["^ "]

[daemon]
enabled = true
autostart = true

[search]
# Recency matters slightly more, while frequent commands stay easy to find.
recency_score_multiplier = 1.5
frequency_score_multiplier = 1.0
frecency_score_multiplier = 1.0

[output]
enabled = false
